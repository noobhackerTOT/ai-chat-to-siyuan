<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI 对话 → 思源笔记</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --text-dim: #64748b;
      --accent: #4f46e5;
      --accent-hover: #6366f1;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; padding: 0; margin: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
    }
    .header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .header .logo { font-size: 22px; }
    .header h1 { font-size: 15px; font-weight: 600; flex: 1; }
    .header .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
    }
    .header .status-dot.online { background: var(--success); }
    .header .status-dot.offline { background: var(--error); }

    .body { padding: 16px 20px 20px; }
    .info {
      background: var(--card); border-radius: 10px; padding: 12px 16px;
      margin-bottom: 14px; font-size: 13px; line-height: 1.6;
    }
    .info .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .info .val { color: var(--text); word-break: break-all; }

    .btn {
      display: block; width: 100%;
      padding: 10px 0; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all 0.2s; margin-bottom: 8px;
    }
    .btn-primary {
      background: var(--accent); color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #293548; }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      padding: 10px 14px; border-radius: 8px; margin-bottom: 10px;
      font-size: 13px; display: none;
    }
    .msg.success { display: block; background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.2); }
    .msg.error { display: block; background: rgba(239,68,68,0.15); color: var(--error); border: 1px solid rgba(239,68,68,0.2); }
    .msg.loading { display: block; background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }

    .footer { padding: 12px 20px; border-top: 1px solid var(--border); text-align: center; }
    .footer a { color: var(--text-dim); font-size: 12px; text-decoration: none; }
    .footer a:hover { color: var(--accent); }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; background: var(--card); border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">📥</span>
    <h1>AI 对话 → 思源</h1>
    <span class="status-dot offline" id="statusDot" title="思源连接状态"></span>
  </div>

  <div class="body">
    <div class="msg" id="msg"></div>

    <div id="pageInfo" class="info">
      <div class="label">当前页面</div>
      <div class="val" id="currentPage">—</div>
    </div>

    <div id="notebookInfo" class="info">
      <div class="label">目标笔记本</div>
      <div class="val" id="currentNotebook">—</div>
    </div>

    <button class="btn btn-primary" id="saveBtn">
      📥 提取并保存到思源
    </button>

    <button class="btn btn-secondary" id="previewBtn">
      👁 预览 Markdown
    </button>

    <button class="btn btn-secondary" id="settingsBtn">
      ⚙ 插件设置
    </button>
  </div>

  <div class="footer">
    <a href="#" id="openOptions">设置思源 API 连接</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
